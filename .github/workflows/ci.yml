name: Dogram CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Compile
        run: python -m compileall -q dogram tests
      - name: Constitutional floor
        run: |
          python - <<'PY'
          import pathlib
          import tomllib
          from dogram.engine import OPERATORS
          from dogram.registry import build_bootstrap_registry

          pyproject = tomllib.loads(pathlib.Path("pyproject.toml").read_text())
          assert pyproject["project"]["dependencies"] == []
          assert set(OPERATORS) == {
              ("delta", 1),
              ("rectangle", 1),
              ("ablate", 1),
              ("reach", 1),
          }
          assert set(build_bootstrap_registry().ids()) == {
              "core.get@1",
              "core.same@1",
              "core.add@1",
              "core.sub@1",
              "core.length@1",
              "core.gt@1",
              "core.select_first@1",
              "trace.compare_ordered@1",
              "graph.apply_mutation@1",
              "graph.reachable_pairs@1",
              "graph.query_paths@1",
              "set.difference@1",
          }
          print("constitutional floor OK")
          PY